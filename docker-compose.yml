services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: email_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data", "./db:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres-data:
